# Coverage-Konfiguration.
#
# NICHT `.coveragerc`. Der naheliegende Aufräumbefehl vor einem Messlauf ist
# `rm -f .coverage*` — und der löscht `.coveragerc` mit. Der Lauf sieht danach
# aus wie „der Patch wirkt nicht" und ist „die Konfiguration ist weg". Der
# Name kostet nichts und nimmt die Falle heraus.
#
# `parallel = True` ist nicht optional: 45 Angriffe starten das CLI als
# Unterprozess (ADR 0015). Ohne Parallelmodus überschreiben sich deren
# Datenfiles gegenseitig und das Ergebnis ist die Messung des letzten Laufs.

[run]
parallel = True
source = src/ohpipe
data_file = .coverage-data
omit =
    */__pycache__/*

[report]
# Bewusst OHNE `fail_under`. Eine Schwelle auf eine Zahl, die noch niemand
# gelesen hat, wird beim ersten roten Lauf gesenkt statt erfüllt. Der Job
# weist die Zahl aus; ob sie reicht, entscheidet ein Mensch, der die
# ungedeckten Zeilen gesehen hat.
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
